<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBB-auth — Decoupled Social Sign-In Demo</title>
  <!-- Load Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Load BBB-auth Security Layer -->
  <script src="../client/auth-service.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .auth-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h2 { margin-top: 0; text-align: center; }
    p.sub { color: #9ca3af; text-align: center; font-size: 14px; margin-bottom: 24px; }
    .btn {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .btn:hover { background: #374151; }
    .btn-apple { background: #000; border-color: #333; }
    .btn-apple:hover { background: #1a1a1a; }
    .status {
      margin-top: 20px;
      padding: 12px;
      background: #1f2937;
      border-radius: 8px;
      font-size: 13px;
      color: #10b981;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Welcome to BBB-auth</h2>
    <p class="sub">Decoupled, zero-leakage authentication layer</p>

    <!-- Google Sign-In button -->
    <button class="btn" id="google-btn" onclick="handleGoogleSignIn()">
      Continue with Google
    </button>

    <!-- Apple Sign-In button -->
    <button class="btn btn-apple" id="apple-btn" onclick="handleAppleSignIn()">
      Sign in with Apple
    </button>

    <!-- GitHub Sign-In button -->
    <button class="btn" id="github-btn" onclick="handleGitHubSignIn()">
      Continue with GitHub
    </button>

    <div id="status-box" class="status"></div>
  </div>

  <script>
    // 1. Optional configuration
    BigBBAuth.configure({
      googleClientId: '371666322360-m0h8rhffcdh75hvnlaudcbnonv9nk3jf.apps.googleusercontent.com',
      apiBase: 'https://api.bigbankbonus.com'
    });

    // 2. React to auth state changes anywhere in the app
    BigBBAuth.onAuthStateChange(function(user) {
      const box = document.getElementById('status-box');
      if (user) {
        box.style.display = 'block';
        box.textContent = 'Authenticated as: ' + (user.email || user.name || 'User');
      } else {
        box.style.display = 'none';
      }
    });

    // 3. Clean UI click handlers delegating to the security layer
    function handleGoogleSignIn() {
      const btn = document.getElementById('google-btn');
      btn.textContent = 'Connecting to Google…';
      BigBBAuth.signInWithGoogle({ returnTo: 'command-center.html' });
    }

    function handleAppleSignIn() {
      const btn = document.getElementById('apple-btn');
      btn.textContent = 'Redirecting to Apple…';
      BigBBAuth.signInWithApple({ returnTo: 'command-center.html' });
    }

    function handleGitHubSignIn() {
      const btn = document.getElementById('github-btn');
      btn.textContent = 'Redirecting to GitHub…';
      BigBBAuth.signInWithGitHub({ returnTo: 'command-center.html' });
    }
  </script>
</body>
</html>
